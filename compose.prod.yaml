# Prod-окружение: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Порты инфраструктуры наружу не публикуются, открыт только api
services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  s3:
    restart: unless-stopped

  api:
    build:
      target: prod
    environment:
      NODE_ENV: production
    restart: unless-stopped

  worker:
    build:
      target: prod
    environment:
      NODE_ENV: production
    restart: unless-stopped
