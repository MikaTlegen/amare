name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Линт, типы, тесты
    runs-on: ubuntu-latest
    steps:
      # Actions закреплены на SHA коммита: теги изменяемы
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test

  compose-smoke:
    name: Prod-стек в docker compose
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Одноразовые тестовые значения, генерируются на каждый запуск — это не секреты
      - name: Тестовый .env
        run: |
          {
            echo "API_PORT=3000"
            echo "POSTGRES_USER=amare"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=amare"
            echo "S3_BUCKET=amare"
            echo "S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Запуск стека
        run: docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait --wait-timeout 300

      - name: Проверка health
        run: |
          curl -fsS http://localhost:3000/health
          curl -fsS http://localhost:3000/health/ready

      - name: Логи при ошибке
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs

      - name: Остановка
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml down -v
